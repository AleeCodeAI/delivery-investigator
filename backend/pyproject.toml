[project]
name = "delivery-Investigation-backend"
version = "0.1.0"
description = "This is the backend of Delivery Investigation Agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "colorlog>=6.10.1",
    "fastapi>=0.139.0",
    "langfuse>=2.0.0,<3.0.0",
    "openai>=2.45.0",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.21.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.51.0",
]


[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pandas>=3.0.3",
]
